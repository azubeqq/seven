# --- roles/docker/tasks/main.yml ---
---
# Задачи установки и настройки Docker

# Устанавливаем Docker из репозитория Amazon Linux
- name: Install Docker engine
  ansible.builtin.yum:
    name: docker
    state: present

# Docker должен работать всегда
- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true   # Автозапуск при boot
    state: started  # Запустить сейчас

# Установка плагина Docker Compose V2
- name: 1. Make sure the Docker Compose plugin directory exists
  ansible.builtin.file:
    path: "{{ docker_compose_plugin_dir }}" # Используем переменную каталога
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: 2. Installing the Docker Compose V2 plugin (Download)
  ansible.builtin.get_url:
    url: "{{ docker_compose_url }}" # Используем переменную URL
    dest: "{{ docker_compose_plugin_path }}" # Используем переменную пути к файлу
    mode: '0755'
    owner: root
    group: root

# Директория для конфига (может не существовать)
- name: Create Docker daemon config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

# Настраиваем Docker daemon (metrics, logging и т.д.)
- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: "{{ docker_daemon_config_path }}"
    mode: '0644'
  notify: Restart Docker

# Позволяет запускать docker без sudo
- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ app_user }}"
    groups: docker
    append: true

# Устанавливаем docker-compose как отдельный бинарник
- name: Install Docker Compose (standalone binary)
  ansible.builtin.get_url:
    url: "{{ docker_compose_url }}"
    dest: "{{ docker_compose_path }}"
    mode: '0755'

# Проверяем что установилось корректно
- name: Verify Docker Compose installation
  ansible.builtin.command:
    cmd: "{{ docker_compose_path }} version"
  register: compose_version
  changed_when: false

- name: Show Docker Compose version
  ansible.builtin.debug:
    msg: "Docker Compose installed: {{ compose_version.stdout }}"

# Создаём Docker сеть ДО запуска ролей
# Все контейнеры будут в этой сети
- name: Ensure Docker network exists
  community.docker.docker_network:
    name: "{{ docker_network_name }}"
    state: present
  tags: always

- name: Установка плагина Docker Buildx (требуется для сборки)
  ansible.builtin.get_url:
    # ИСПРАВЛЕННЫЙ URL: Используем 'amd64' вместо 'x86_64' для Buildx v0.20.0
    url: "https://github.com/docker/buildx/releases/download/v0.20.0/buildx-v0.20.0.linux-amd64"
    # Сохраняем файл в каталоге плагинов Docker, переименовывая его в 'docker-buildx'
    dest: /usr/local/lib/docker/cli-plugins/docker-buildx
    mode: '0755'
