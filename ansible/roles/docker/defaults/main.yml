# ========================================
# РОЛЬ: docker
# Установка Docker и Docker Compose
# ========================================

# --- roles/docker/defaults/main.yml ---
---
# Версия Docker Compose (standalone binary)
docker_compose_version: "v2.24.6"

# URL для скачивания Docker Compose
docker_compose_url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-x86_64"

# Путь установки Docker Compose
docker_compose_path: /usr/local/bin/docker-compose

# Включить Docker metrics endpoint для мониторинга
docker_metrics_enabled: true
docker_metrics_port: 9323

# Путь к конфигу Docker daemon
docker_daemon_config_path: /etc/docker/daemon.json
